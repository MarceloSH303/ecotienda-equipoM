<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contacto | MaBeth Energy</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="css/estilos.css">
    </head>
    <body class="container py-3">
        <header>
            <h1>Contacto</h1>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="catalogo.html">Catálogo</a>
                <a href="nosotros.html">Nosotros</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </header>
                <main>
            <section>
                <h2>Escríbenos</h2>
                <form action="contacto.html" method="get">
                    <p>
                        <label for="nombre">Nombre:</label>
                        <input class="form-control" type="text" id="nombre" name="nombre" required>
                    </p>
                    <p>
                        <label for="correo">Correo electrónico:</label>
                        <input class="form-control" type="email" id="correo" name="correo" required>
                    </p>
                    <p>
                        <label for="telefono">Teléfono:</label>
                        <input class="form-control" type="tel" id="telefono" name="telefono">
                    </p>
                    <p>
                        <label for="interes">Producto de interés:</label>
                        <select class="form-select" id="interes" name="interes">
                            <option value="iluminacion">Iluminación</option>
                            <option value="cocina">Cocina</option>
                            <option value="refrigeracion">Refrigeración</option>
                            <option value="oficina">Oficina</option>
                        </select>
                    </p>
                    <p>
                        <label for="mensaje">Mensaje:</label>
                        <textarea class="form-control" id="mensaje" name="mensaje" rows="4" required></textarea>
                    </p>
                    <button class="btn btn-success" type="submit">Enviar</button>
                </form>
            </section>
        </main>
        <footer>
            <p>Ingeniería Web I · IU Digital de Antioquia · 2026-2</p>
        </footer>
    </body>
</html>
